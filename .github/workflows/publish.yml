name: Publish to Pub.dev

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  deploy:
    name: "Deploy to Pub.dev"
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      environment: release

  release:
    name: Create GitHub Release
    needs: deploy
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Publish release notes
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists."
            exit 0
          fi

          version=$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)
          if [[ -z "$version" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match pubspec version $version."
            exit 1
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## $version" '
            $0 == heading { section = 1; next }
            section && /^## / { exit }
            section { print }
          ' CHANGELOG.md > "$notes"

          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no release notes for $version."
            exit 1
          fi

          printf '\n[Published package on pub.dev](https://pub.dev/packages/flutter_simple_country_picker/versions/%s)\n' "$version" >> "$notes"

          release_flags=()
          if [[ "${version%%+*}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes" \
            "${release_flags[@]}"
