name: Platform screenshots

on:
  workflow_dispatch:
  push:
    branches: [ziqq/platform-screenshots-oct15]
    paths:
      - .github/workflows/platform-screenshots.yml
      - example/integration_test/platform_screenshots_test.dart
      - example/test_driver/platform_screenshots_driver.dart
      - example/test_driver/prepare_screenshot_host.py

permissions:
  contents: read

jobs:
  screenshots:
    name: Screenshots (${{ matrix.device }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            device: windows
            arch: x64
          - runner: windows-11-arm
            device: windows
            arch: arm64
          - runner: ubuntu-24.04
            device: linux
            arch: x64
          - runner: macos-15
            device: macos
            arch: native
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: jdx/mise-action@v4.0.0
        with:
          install: true
          cache: true
      - name: Initialize ARM64 Dart
        if: matrix.device == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $flutterRoot = mise where flutter
          Remove-Item "$flutterRoot/bin/cache/engine-dart-sdk.stamp" -ErrorAction SilentlyContinue
          mise exec -- flutter --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux dependencies
        if: matrix.device == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev fonts-noto-color-emoji xvfb
      - name: Prepare isolated host
        run: python example/test_driver/prepare_screenshot_host.py ${{ matrix.device }}
      - name: Dependencies
        working-directory: build/platform-screenshot-host
        run: mise exec -- flutter pub get
      - name: Capture Windows or macOS
        if: matrix.device != 'linux'
        working-directory: build/platform-screenshot-host
        run: mise exec -- flutter drive --no-dds --driver=test_driver/platform_screenshots_driver.dart --target=integration_test/platform_screenshots_test.dart --dart-define=CAPTURE_REVISION=${{ github.sha }} -d ${{ matrix.device }}
      - name: Capture Linux
        if: matrix.device == 'linux'
        working-directory: build/platform-screenshot-host
        run: xvfb-run -a -s '-screen 0 1280x1024x24' mise exec -- flutter drive --no-dds --driver=test_driver/platform_screenshots_driver.dart --target=integration_test/platform_screenshots_test.dart --dart-define=CAPTURE_REVISION=${{ github.sha }} -d linux
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: screenshots-${{ matrix.device }}-${{ matrix.arch }}
          path: build/platform-screenshot-host/build/platform-screenshots/
          if-no-files-found: error
