name: "Checkout"


on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "master"
      #- "dev"
      #- "develop"
      #- "feature/**"
      #- "bugfix/**"
      #- "hotfix/**"
      #- "support/**"
    paths:
      - "lib/**.dart"
      - "test/**.dart"
      - "example/**.dart"
      - .github/workflows/*.yml
      - "pubspec.yaml"
      - "example/pubspec.yaml"
      - "assets/**"
      - "mise.toml"
      - "mise.lock"
  pull_request:
    branches:
      - "main"
      - "master"
      - "dev"
      - "develop"
      - "development"
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "support/**"
    paths:
      - "lib/**.dart"
      - "test/**.dart"
      - "example/**.dart"
      - .github/workflows/*.yml
      - "pubspec.yaml"
      - "example/pubspec.yaml"
      - "assets/**"
      - "mise.toml"
      - "mise.lock"

permissions:
  actions: read
  id-token: write
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkout:
    name: Checkout
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    env:
      pub-cache-name: pub
      threshold: 50
      # Avoid downloading every desktop SDK when mise refreshes checksums.
      MISE_LOCKFILE_PLATFORMS: linux-x64
    timeout-minutes: 15
    concurrency:
      group: checkout-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Get latest code
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            .github
            pubspec.yaml
            mise.toml
            mise.lock
            assets
            lib
            test
            tool
            example
            analysis_options.yaml
            CHANGELOG.md

      - name: Check content
        timeout-minutes: 1
        shell: bash
        run: |
          for file in README.md CHANGELOG.md CONTRIBUTING.md LICENSE; do
            test -f "$file" || { echo "::error::Missing required file: $file"; exit 1; }
          done
          test -d example

      - name: Check description
        timeout-minutes: 1
        run: grep -Fxq '## Description' README.md

      - name: Check quick start
        timeout-minutes: 1
        run: grep -Fxq '## Quick Start' README.md

      - name: Check getting started
        timeout-minutes: 1
        run: grep -Fxq '## Getting Started' README.md

      - name: Check setup localizations
        timeout-minutes: 1
        run: grep -Fxq '## Setup Localizations' README.md

      - name: Check custom localizations
        timeout-minutes: 1
        run: grep -Fxq '### Custom localizations' README.md

      - name: Check usage
        timeout-minutes: 1
        run: grep -Fxq '## Usage' README.md

      - name: Install flutter
        uses: jdx/mise-action@v4.0.0
        id: install-flutter
        with:
          install: true
          cache: true

      - name: Check flutter version
        id: check-flutter-version
        run: flutter --version
        timeout-minutes: 1

      - name: Restore Pub modules
        id: cache-pub-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.pub-cache
          key: ${{ runner.os }}-pub-${{ env.pub-cache-name }}-${{ hashFiles('**/pubspec.yaml') }}

      - name: Export Pub cache directory
        id: export-pub-cache
        timeout-minutes: 1
        run: |
          export PUB_CACHE=/home/runner/.pub-cache
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          echo "${HOME}/.pub-cache/bin" >> $GITHUB_PATH

      # - name: Install dependencies
      #   run: flutter pub get

      # - name: Install Dependencies
      #   id: install-dependencies
      #   timeout-minutes: 2
      #   run: |
      #     apt-get update && apt-get install -y lcov
      #     flutter pub get --no-example

      - name: Install Dependencies
        id: install-dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          echo /home/runner/.pub-cache/bin >> $GITHUB_PATH
          flutter config --no-cli-animations --no-analytics
          flutter pub get

      - name: Save Pub modules
        id: cache-pub-save
        if: steps.cache-pub-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.pub-cache
          key: ${{ runner.os }}-pub-${{ env.pub-cache-name }}-${{ hashFiles('**/pubspec.yaml') }}

      - name: Run dependency validator
        timeout-minutes: 1
        run: |
          dart pub global activate dependency_validator
          dart pub global run dependency_validator:dependency_validator

      - name: Check format
        id: check-format
        timeout-minutes: 1
        run: |
          find lib test example/integration_test \
          -path '*/generated/*' -prune -o \
          -type f -name '*.dart' \
          ! -name '*.*.dart' \
          ! -name 'messages_.*.dart' \
          ! -name 'l10n.dart' \
          -print0 |
          xargs -0 dart format --set-exit-if-changed --line-length 80 -o none

      - name: Check for Warnings
        id: check-analyzer
        timeout-minutes: 1
        run: |
          flutter analyze --fatal-warnings --no-fatal-infos lib/ test/ example/integration_test/

      - name: Unit & Widget tests
        run: |
          flutter test --coverage --concurrency=40 test/flutter_simple_country_picker_test.dart

      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true

      - name: Upload test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Test report"
          path: "reports/tests.json"
          reporter: flutter-json
          fail-on-error: "false"

  windows:
    name: Windows flags (${{ matrix.architecture }}, Flutter ${{ matrix.flutter }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: x64
            flutter: '3.47.5'
          - runner: windows-latest
            architecture: x64
            flutter: '3.44.0'
          - runner: windows-11-arm
            architecture: arm64
            flutter: '3.47.5'
    timeout-minutes: 25
    env:
      MISE_LOCKFILE_PLATFORMS: windows-${{ matrix.architecture }}
    permissions:
      contents: read
    steps:
      - name: Get latest code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select minimum Flutter
        if: matrix.flutter == '3.44.0'
        shell: pwsh
        run: |
          (Get-Content mise.toml -Raw).Replace('version = "3.47.5"', 'version = "3.44.0"') |
            Set-Content mise.toml

      - name: Install Flutter
        uses: jdx/mise-action@v4.0.0
        with:
          install: true
          cache: true

      - name: Initialize native ARM64 Dart
        if: matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          # The official Windows archive includes x64 Dart. Let Flutter's own
          # bootstrap download the matching native SDK on the ARM64 runner.
          $flutterRoot = mise where flutter
          Remove-Item "$flutterRoot/bin/cache/engine-dart-sdk.stamp" -ErrorAction SilentlyContinue
          mise exec -- flutter --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dartVersion = mise exec -- dart --version 2>&1 | Out-String
          if ($dartVersion -notmatch 'windows_arm64') {
            throw "Expected native ARM64 Dart: $dartVersion"
          }

      - name: Check Flutter version
        shell: pwsh
        run: |
          mise exec -- flutter --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = mise exec -- flutter --version --machine | Out-String | ConvertFrom-Json
          if ($version.frameworkVersion -ne '${{ matrix.flutter }}') {
            throw "Unexpected Flutter version: $($version.frameworkVersion)"
          }

      - name: Install dependencies
        run: mise exec -- flutter pub get

      - name: Check minimum Flutter compatibility
        if: matrix.flutter == '3.44.0'
        run: |
          mise exec -- flutter analyze --fatal-warnings --no-fatal-infos lib/ test/ example/integration_test/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- flutter test test/flutter_simple_country_picker_test.dart

      - name: Build Windows example
        working-directory: example
        run: mise exec -- flutter build windows --release

      - name: Check bundled flag font
        shell: pwsh
        run: |
          $source = 'assets/fonts/TwemojiCountryFlags.ttf'
          $bundled = 'example/build/windows/${{ matrix.architecture }}/runner/Release/data/flutter_assets/packages/flutter_simple_country_picker/assets/fonts/TwemojiCountryFlags.ttf'
          if (!(Test-Path $bundled)) { throw 'Windows flag font is missing from the release bundle' }
          if ((Get-FileHash $source).Hash -ne (Get-FileHash $bundled).Hash) {
            throw 'Windows flag font differs from the source asset'
          }

      - name: Capture native engine stderr
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path example/build/windows-flags -Force | Out-Null
          # GUI processes have no console on this runner. Route the engine's
          # release CRT stream directly to a file, without touching rendering.
          $path = 'example/windows/runner/main.cpp'
          $source = Get-Content $path -Raw
          $source = $source.Replace('#include <windows.h>', "#include <windows.h>`n#include <cstdio>")
          $diagnostic = @'
            wchar_t engine_log[32768] = {};
            const DWORD log_length = ::GetEnvironmentVariableW(L"PICKER_ENGINE_LOG", engine_log, 32768);
            if (log_length > 0 && log_length < 32768) {
              const HMODULE crt = ::GetModuleHandleW(L"ucrtbase.dll");
              if (crt != nullptr) {
                using StreamGetter = FILE* (__cdecl*)(unsigned);
                using StreamRedirect = int (__cdecl*)(FILE**, const wchar_t*, const wchar_t*, FILE*);
          #pragma warning(push)
          #pragma warning(disable: 4191)
                const auto stream = reinterpret_cast<StreamGetter>(::GetProcAddress(crt, "__acrt_iob_func"));
                const auto redirect = reinterpret_cast<StreamRedirect>(::GetProcAddress(crt, "_wfreopen_s"));
          #pragma warning(pop)
                if (stream != nullptr && redirect != nullptr) {
                  FILE* output = nullptr;
                  redirect(&output, engine_log, L"w", stream(2));
                }
              }
            }
          '@
          $needle = '  // Initialize COM,'
          if (!$source.Contains($needle)) { throw 'Windows runner log hook not found' }
          $source = $source.Replace($needle, "$diagnostic`n  ::AddVectoredExceptionHandler(1, LogNativeException);`n$needle")
          # WER does not receive this access violation. Observe its module and
          # stack without handling it or changing the original exit behavior.
          $handler = @'
          LONG CALLBACK LogNativeException(EXCEPTION_POINTERS* details) {
            if (details->ExceptionRecord->ExceptionCode != EXCEPTION_ACCESS_VIOLATION) {
              return EXCEPTION_CONTINUE_SEARCH;
            }
            char path[32768] = {};
            const DWORD length = ::GetEnvironmentVariableA("PICKER_NATIVE_EXCEPTION_LOG", path, 32768);
            if (length == 0 || length >= 32768) return EXCEPTION_CONTINUE_SEARCH;
            const HANDLE output = ::CreateFileA(path, FILE_APPEND_DATA, FILE_SHARE_READ | FILE_SHARE_WRITE,
                                               nullptr, OPEN_ALWAYS, FILE_ATTRIBUTE_NORMAL, nullptr);
            if (output == INVALID_HANDLE_VALUE) return EXCEPTION_CONTINUE_SEARCH;
            void* frames[17] = {};
            frames[0] = details->ExceptionRecord->ExceptionAddress;
            const USHORT count = ::CaptureStackBackTrace(0, 16, frames + 1, nullptr);
            for (USHORT index = 0; index <= count; index++) {
              MEMORY_BASIC_INFORMATION memory = {};
              char module[1024] = {};
              if (::VirtualQuery(frames[index], &memory, sizeof(memory)) != 0) {
                ::GetModuleFileNameA(static_cast<HMODULE>(memory.AllocationBase), module, sizeof(module));
              }
              char line[2048] = {};
              const int bytes = std::snprintf(line, sizeof(line), "%lu frame=%u address=%p module=%s offset=0x%zx\n",
                  details->ExceptionRecord->ExceptionCode, static_cast<unsigned>(index), frames[index], module,
                  static_cast<SIZE_T>(reinterpret_cast<ULONG_PTR>(frames[index]) - reinterpret_cast<ULONG_PTR>(memory.AllocationBase)));
              if (bytes > 0 && bytes < static_cast<int>(sizeof(line))) {
                DWORD written = 0;
                ::WriteFile(output, line, static_cast<DWORD>(bytes), &written, nullptr);
              }
            }
            ::CloseHandle(output);
            return EXCEPTION_CONTINUE_SEARCH;
          }

          '@
          $source.Replace('int APIENTRY wWinMain', "$handler`nint APIENTRY wWinMain") | Set-Content $path

      - name: Collect own-process native crash metadata
        if: matrix.flutter == '3.47.5'
        shell: pwsh
        run: |
          $folder = Join-Path $env:GITHUB_WORKSPACE 'example/build/windows-flags/dumps'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\example.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $folder -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 1 -Force | Out-Null

      - name: Check native flag rendering
        working-directory: example
        shell: pwsh
        env:
          PICKER_ENGINE_LOG: ${{ github.workspace }}\example\build\windows-flags\engine-stderr.log
          PICKER_NATIVE_EXCEPTION_LOG: ${{ github.workspace }}\example\build\windows-flags\native-exception.log
        run: |
          # The native test needs no credentials in its process environment.
          Get-ChildItem Env: | Where-Object {
            $_.Name -match 'TOKEN|SECRET|PASSWORD|WEBHOOK|CREDENTIAL|PRIVATE_KEY'
          } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          $exitLog = Join-Path $env:GITHUB_WORKSPACE 'example/build/windows-flags/native-exit.json'
          $monitor = Start-Job -ArgumentList $exitLog -ScriptBlock {
            param($path)
            $deadline = (Get-Date).AddMinutes(5)
            do {
              $native = Get-Process -Name example -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($native) {
                # Retain the handle before exit; reopening an exited PID loses its status.
                $null = $native.Handle
                $native.WaitForExit()
                @{ pid = $native.Id; exitCode = $native.ExitCode } |
                  ConvertTo-Json | Set-Content $path
                break
              }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
          }
          mise exec -- flutter drive --target=integration_test/windows_flags_test.dart --driver=test_driver/native_flags.dart -d windows --verbose
          $result = $LASTEXITCODE
          Wait-Job $monitor -Timeout 5 | Out-Null
          Receive-Job $monitor
          Stop-Job $monitor
          Remove-Job $monitor
          if (Test-Path $exitLog) { Get-Content $exitLog }
          if ($result -ne 0) { exit $result }

      - name: Read native engine stderr
        if: always()
        shell: pwsh
        run: |
          $path = 'example/build/windows-flags/engine-stderr.log'
          if (Test-Path $path) { Get-Content $path }
          $path = 'example/build/windows-flags/native-exception.log'
          if (Test-Path $path) { Get-Content $path }

      - name: Read native crash module
        if: failure()
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          Get-WinEvent -FilterHashtable @{
            LogName = 'Application'
            Id = 1000, 1001
            StartTime = (Get-Date).AddMinutes(-10)
          } -ErrorAction SilentlyContinue |
            Select-Object TimeCreated, Id, ProviderName, Message |
            ConvertTo-Json -Depth 4 |
            Tee-Object -FilePath example/build/windows-flags/native-crash-events.json

      - name: Upload flag screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-flags-${{ matrix.architecture }}-${{ matrix.flutter }}
          path: |
            example/build/windows-flags/*.png
            example/build/windows-flags/engine-stderr.log
            example/build/windows-flags/native-crash-events.json
            example/build/windows-flags/native-exit.json
            example/build/windows-flags/native-exception.log
            example/build/windows-flags/dumps/*.dmp
          if-no-files-found: ignore

  notify:
    name: Notify CI result
    needs: [checkout, windows]
    continue-on-error: true
    if: >-
      always() &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NOTIFY_DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      NOTIFY_TELEGRAM_TARGETS: ${{ secrets.TELEGRAM_TARGETS }}
    steps:
      - name: Select configured notification channels
        id: channels
        shell: bash
        run: |
          providers=()
          if [[ -n "$NOTIFY_DISCORD_WEBHOOKS" ]]; then
            providers+=(discord)
          else
            echo '::notice::Discord notifications need the DISCORD_WEBHOOKS repository secret.'
          fi
          if [[ -n "$NOTIFY_TELEGRAM_BOT_TOKEN" && -n "$NOTIFY_TELEGRAM_TARGETS" ]]; then
            providers+=(telegram)
          else
            echo '::notice::Telegram notifications need the TELEGRAM_BOT_TOKEN and TELEGRAM_TARGETS repository secrets.'
          fi
          printf 'providers=%s\n' "$(IFS=,; echo "${providers[*]}")" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted notification template
        if: steps.channels.outputs.providers != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - name: Notify configured channels
        if: >-
          steps.channels.outputs.providers != '' &&
          hashFiles('.github/notify/templates/ci.md') != ''
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: ${{ steps.channels.outputs.providers }}
          template-path: .github/notify/templates/ci.md
          variables: |
            {
              "pub_dev_url": "https://pub.dev/packages/flutter_simple_country_picker",
              "status_label": ${{ toJSON(needs.checkout.result == 'success' && needs.windows.result == 'success' && 'success' || (needs.checkout.result == 'cancelled' || needs.windows.result == 'cancelled') && 'cancelled' || 'failure') }}
            }
          failure-policy: best-effort
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ env.NOTIFY_DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ env.NOTIFY_TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ env.NOTIFY_TELEGRAM_TARGETS }}
