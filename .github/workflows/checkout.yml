name: "Checkout"


on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "master"
      #- "dev"
      #- "develop"
      #- "feature/**"
      #- "bugfix/**"
      #- "hotfix/**"
      #- "support/**"
    paths:
      - "lib/**.dart"
      - "test/**.dart"
      - "example/**.dart"
      - .github/workflows/*.yml
      - "pubspec.yaml"
      - "example/pubspec.yaml"
  pull_request:
    branches:
      - "main"
      - "master"
      - "dev"
      - "develop"
      - "development"
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "support/**"
    paths:
      - "lib/**.dart"
      - "test/**.dart"
      - "example/**.dart"
      - .github/workflows/*.yml
      - "pubspec.yaml"
      - "example/pubspec.yaml"

permissions:
  actions: read
  id-token: write
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkout:
    name: Checkout
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    env:
      pub-cache-name: pub
      threshold: 50
    timeout-minutes: 15
    concurrency:
      group: checkout-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Get latest code
        id: checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            pubspec.yaml
            lib
            test
            analysis_options.yaml
            CHANGELOG.md

      - name: Check content
        id: check-files
        timeout-minutes: 1
        uses: andstor/file-existence-action@v1
        with:
          files: "README.md, CHANGELOG.md, CONTRIBUTING.md, LICENSE, example"

      - name: File exists
        if: steps.check-files.outputs.files_exists == 'true'
        run: echo Content is OK!

      - name: Check description
        timeout-minutes: 1
        run: echo | grep -q Description README.md ; echo $?

      - name: Check suick start
        timeout-minutes: 1
        run: echo | grep -q Quick Start README.md ; echo $?

      - name: Check getting started
        timeout-minutes: 1
        run: echo | grep -q Getting Started README.md ; echo $?

      - name: Check setup localizations
        timeout-minutes: 1
        run: echo | grep -q Setup Localizations README.md ; echo $?

      - name: Check custom localizations
        timeout-minutes: 1
        run: echo | grep -q Custom localizations README.md ; echo $?

      - name: Check usage
        timeout-minutes: 1
        run: echo | grep -q Usage README.md ; echo $?

      - name: Install flutter
        uses: subosito/flutter-action@v2
        id: install-flutter
        with:
          channel: 'stable'

      - name: Check flutter version
        id: check-flutter-version
        run: flutter --version
        timeout-minutes: 1

      - name: Restore Pub modules
        id: cache-pub-restore
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.pub-cache
          key: ${{ runner.os }}-pub-${{ env.pub-cache-name }}-${{ hashFiles('**/pubspec.yaml') }}

      - name: Export Pub cache directory
        id: export-pub-cache
        timeout-minutes: 1
        run: |
          export PUB_CACHE=/home/runner/.pub-cache
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          echo "${HOME}/.pub-cache/bin" >> $GITHUB_PATH

      # - name: Install dependencies
      #   run: flutter pub get

      # - name: Install Dependencies
      #   id: install-dependencies
      #   timeout-minutes: 2
      #   run: |
      #     apt-get update && apt-get install -y lcov
      #     flutter pub get --no-example

      - name: Install Dependencies
        id: install-dependencies
        shell: bash
        run: |
          apt-get update && apt-get install -y lcov
          echo /home/runner/.pub-cache/bin >> $GITHUB_PATH
          flutter config --no-cli-animations --no-analytics
          flutter pub get

      - name: Save Pub modules
        id: cache-pub-save
        if: steps.cache-pub-restore.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: /home/runner/.pub-cache
          key: ${{ runner.os }}-pub-${{ env.pub-cache-name }}-${{ hashFiles('**/pubspec.yaml') }}

      - name: Run dependency validator
        timeout-minutes: 1
        run: |
          dart pub global activate dependency_validator
          dart pub global run dependency_validator:dependency_validator

      - name: Check format
        id: check-format
        timeout-minutes: 1
        run: |
          find lib test \
          -path '*/generated/*' -prune -o \
          -type f -name '*.dart' \
          ! -name '*.*.dart' \
          ! -name 'messages_.*.dart' \
          ! -name 'l10n.dart' \
          -print0 |
          xargs -0 dart format --set-exit-if-changed --line-length 80 -o none

      - name: Check for Warnings
        id: check-analyzer
        timeout-minutes: 1
        run: |
          flutter analyze --fatal-warnings --no-fatal-infos lib/ test/

      - name: Unit & Widget tests
        run: |
          flutter test --coverage --concurrency=40 test/flutter_simple_country_picker_test.dart

      - name: Upload coverage report
        uses: codecov/codecov-action@v2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

      - name: Upload test report
        uses: dorny/test-reporter@v1
        with:
          name: "Test report"
          path: "reports/tests.json"
          reporter: flutter-json
          fail-on-error: "false"

  notify:
    name: Notify CI result
    needs: checkout
    continue-on-error: true
    if: >-
      always() &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NOTIFY_DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      NOTIFY_TELEGRAM_TARGETS: ${{ secrets.TELEGRAM_TARGETS }}
    steps:
      - name: Report missing notification secrets
        if: >-
          env.NOTIFY_DISCORD_WEBHOOKS == '' ||
          env.NOTIFY_TELEGRAM_BOT_TOKEN == '' ||
          env.NOTIFY_TELEGRAM_TARGETS == ''
        shell: bash
        run: >-
          echo "::warning::CI notification skipped because one or more notification secrets are not configured."

      - name: Checkout trusted notification template
        if: >-
          env.NOTIFY_DISCORD_WEBHOOKS != '' &&
          env.NOTIFY_TELEGRAM_BOT_TOKEN != '' &&
          env.NOTIFY_TELEGRAM_TARGETS != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - name: Notify Discord and Telegram
        if: >-
          env.NOTIFY_DISCORD_WEBHOOKS != '' &&
          env.NOTIFY_TELEGRAM_BOT_TOKEN != '' &&
          env.NOTIFY_TELEGRAM_TARGETS != '' &&
          hashFiles('.github/notify/templates/ci.md') != ''
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/ci.md
          variables: |
            {
              "pub_dev_url": "https://pub.dev/packages/flutter_simple_country_picker",
              "status_label": ${{ toJSON(needs.checkout.result == 'success' && 'success' || needs.checkout.result == 'cancelled' && 'cancelled' || 'failure') }}
            }
          failure-policy: best-effort
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ env.NOTIFY_DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ env.NOTIFY_TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ env.NOTIFY_TELEGRAM_TARGETS }}
